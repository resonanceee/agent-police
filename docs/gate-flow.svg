<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="180" height="70" rx="8" fill="#eef3ff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-weight="bold">Coding agent</text>
  <text x="130" y="88" text-anchor="middle">issues a bash command</text>

  <rect x="330" y="25" width="240" height="100" rx="8" fill="#f6f6f6" stroke="#666" stroke-width="1.5"/>
  <text x="450" y="50" text-anchor="middle" font-weight="bold">Agent Police plugin</text>
  <text x="450" y="70" text-anchor="middle">records command and context</text>
  <text x="450" y="88" text-anchor="middle">in the evidence ledger,</text>
  <text x="450" y="106" text-anchor="middle">then asks the judge model</text>

  <rect x="680" y="40" width="180" height="70" rx="8" fill="#fff7e6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="770" y="68" text-anchor="middle" font-weight="bold">Judge model</text>
  <text x="770" y="88" text-anchor="middle">returns one verdict</text>

  <line x1="220" y1="75" x2="326" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="273" y="66" text-anchor="middle" fill="#555">command</text>
  <line x1="570" y1="75" x2="676" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="623" y="66" text-anchor="middle" fill="#555">context</text>

  <line x1="450" y1="125" x2="160" y2="236" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="125" x2="450" y2="236" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="125" x2="740" y2="236" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="60" y="240" width="200" height="80" rx="8" fill="#e8f6e8" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="160" y="268" text-anchor="middle" font-weight="bold">safe</text>
  <text x="160" y="288" text-anchor="middle">command runs normally,</text>
  <text x="160" y="306" text-anchor="middle">agent sees nothing</text>

  <rect x="350" y="240" width="200" height="80" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="450" y="268" text-anchor="middle" font-weight="bold">elaborate</text>
  <text x="450" y="288" text-anchor="middle">blocked, judge asks one</text>
  <text x="450" y="306" text-anchor="middle">question, agent must justify</text>

  <rect x="640" y="240" width="200" height="80" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="740" y="268" text-anchor="middle" font-weight="bold">human-review</text>
  <text x="740" y="288" text-anchor="middle">blocked until a human</text>
  <text x="740" y="306" text-anchor="middle">approves or cancels</text>

  <rect x="60" y="400" width="300" height="120" rx="8" fill="#f3eefb" stroke="#7b4fa6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="210" y="424" text-anchor="middle" font-weight="bold">Background monitor (optional)</text>
  <text x="210" y="444" text-anchor="middle">runs asynchronously beside this loop.</text>
  <text x="210" y="462" text-anchor="middle">Reads judge reasoning traces and file</text>
  <text x="210" y="480" text-anchor="middle">write outputs, adds flags to the ledger.</text>
  <text x="210" y="498" text-anchor="middle">Never blocks, never contacts the agent.</text>

  <text x="640" y="430" fill="#555">A blocked command can loop back through</text>
  <text x="640" y="450" fill="#555">elaborate at most twice: three turns per</text>
  <text x="640" y="470" fill="#555">command in total, then only safe or</text>
  <text x="640" y="490" fill="#555">human-review remain possible.</text>
</svg>
